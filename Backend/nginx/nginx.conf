# Sentio Mind — nginx (frontend + API proxy)
# Set AUTH_API_ORIGIN to your auth API host (e.g. https://api.product.sentiomind.in)

# Trust only explicit load-balancer / reverse-proxy CIDRs (SEC-011).
# Add your cloud LB subnets here — do NOT trust entire RFC1918 ranges.
set_real_ip_from 127.0.0.1;
# set_real_ip_from 10.0.1.0/24;   # example: internal LB subnet
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

upstream auth_api {
    server 127.0.0.1:5000;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name product.sentiomind.in;

    ssl_certificate     /etc/ssl/certs/sentio.crt;
    ssl_certificate_key /etc/ssl/private/sentio.key;

    server_tokens off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/sentio-frontend/build;
    index index.html;

    client_max_body_size 2m;

    location = /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        limit_conn conn_limit 20;
        proxy_pass http://auth_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Auth / analysis / person API
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 30;
        proxy_pass http://auth_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location /analysis/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 30;
        proxy_pass http://auth_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location /person/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 30;
        proxy_pass http://auth_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location / {
        try_files $uri $uri/ /index.html;

        add_header Content-Security-Policy
            "default-src 'self';
             script-src 'self';
             style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
             img-src 'self' data:;
             font-src 'self' https://fonts.gstatic.com data:;
             connect-src 'self';
             frame-ancestors 'none';
             object-src 'none';
             base-uri 'self';
             report-uri /api/csp-report;"
            always;

        add_header Strict-Transport-Security
            "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy
            "camera=(), microphone=(), geolocation=()" always;
    }

    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy
            "default-src 'self';
             script-src 'self';
             style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
             img-src 'self' data:;
             font-src 'self' https://fonts.gstatic.com data:;
             connect-src 'self';
             frame-ancestors 'none';
             object-src 'none';
             base-uri 'self';
             report-uri /api/csp-report;"
            always;
        add_header Strict-Transport-Security
            "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy
            "camera=(), microphone=(), geolocation=()" always;
    }
}
